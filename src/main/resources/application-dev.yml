server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:gametracker}
    username: ${POSTGRES_USER:gametracker}
    password: ${POSTGRES_PASSWORD:gametracker}

  jpa:
    hibernate:
      ddl-auto: validate   # IMPORTANTE: Flyway manda, Hibernate NO crea tablas
    open-in-view: false    # Buenas prácticas para API
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  seed:
    admin:
      username: admin
      email: admin@gametracker.com
      password: 123456
  security:
    jwt:
      issuer: "game-tracker-api"
      secret: "${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32+}"
      accessTokenMinutes: 60
